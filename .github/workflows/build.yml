name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Every action is pinned to an immutable, audited commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check scripts and metadata
        run: |
          jq empty extension/metadata.json
          bash -n install.sh gh-ai-credit-pulse
          bash tests/wrapper-cli.sh
          unit_dir="$(mktemp -d)"
          trap 'rm -rf "$unit_dir"' EXIT
          sed 's|@COLLECTOR@|/bin/true|g' \
            systemd/gh-ai-credit-pulse-sample.service.in > \
            "$unit_dir/gh-ai-credit-pulse-sample.service"
          cp systemd/gh-ai-credit-pulse-sample.timer "$unit_dir/"
          systemd-analyze verify "$unit_dir"/*.service "$unit_dir"/*.timer

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-

      - name: Prepare native and Rust toolchains in parallel
        run: |
          (sudo apt-get update && sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev) &
          native_setup_pid=$!
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update &
          rust_setup_pid=$!
          wait "$native_setup_pid"
          wait "$rust_setup_pid"
          rustup default 1.96.0

      - name: Test and build Rust binaries
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo build --release --locked
          target/release/gh-ai-credit-pulse --help >/dev/null
          target/release/gh-ai-credit-pulse --version >/dev/null

      - name: Assemble deterministic release bundle
        run: |
          asset="gh-ai-credit-pulse-linux-x86_64-${GITHUB_SHA:0:12}.tar.gz"
          root=staging/gh-ai-credit-pulse
          install -d "$root/assets" "$root/extension" "$root/systemd" release
          install -m 0755 target/release/gh-ai-credit-pulse "$root/gh-ai-credit-pulse-gui"
          install -m 0755 target/release/gh-ai-credit-pulse-collector \
            "$root/gh-ai-credit-pulse-collector"
          install -m 0755 install.sh gh-ai-credit-pulse "$root/"
          install -m 0644 assets/io.github.probably_undefined.GhAiCreditPulse.desktop \
            assets/gh-ai-credit-pulse.png "$root/assets/"
          install -m 0644 extension/extension.js extension/metadata.json extension/stylesheet.css "$root/extension/"
          install -m 0644 systemd/gh-ai-credit-pulse-sample.service.in \
            systemd/gh-ai-credit-pulse-sample.timer "$root/systemd/"
          version_output="$(target/release/gh-ai-credit-pulse --version)"
          version="${version_output#gh-ai-credit-pulse }"
          if [[ -z "$version" || "$version" == "$version_output" ]]; then
            printf 'Could not resolve package version from binary: %s\n' "$version_output" >&2
            exit 1
          fi
          printf '%s\n' "$version" >"$root/VERSION"
          install -m 0644 README.md LICENSE "$root/"
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "release/${asset}" -C staging gh-ai-credit-pulse
          (cd release && sha256sum "$asset" >"${asset}.sha256")

      - name: Upload isolated build output
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'probably-undefined/gh-ai-credit-pulse'
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'probably-undefined/gh-ai-credit-pulse'
    needs: test-and-build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - name: Download verified workflow artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-bundle
          path: release

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz

      - name: Test consumer verification policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/heads/main" \
            --deny-self-hosted-runners

      - name: Publish rolling attested release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="latest"
          asset="gh-ai-credit-pulse-linux-x86_64-${short_sha}.tar.gz"

          test -f "release/${asset}"
          test -f "release/${asset}.sha256"

          notes='Automated, provenance-attested build from the canonical main branch.'
          previous_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha' 2>/dev/null || true
          )"
          if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ && "$previous_sha" != "$GITHUB_SHA" ]]; then
            notes="$(
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="build-${short_sha}" \
                -f target_commitish="$GITHUB_SHA" \
                -f previous_tag_name="$tag" \
                --jq '.body'
            )"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Upload first. Until the tag moves, installers continue selecting
            # the old SHA-named asset. After the ref update they select the new one.
            gh release upload "$tag" \
              "release/${asset}" "release/${asset}.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            release_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.id'
            )"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="gh-ai-credit-pulse (${short_sha})" \
              -f body="$notes" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=false -F prerelease=true >/dev/null
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
                 >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release create "$tag" \
              "release/${asset}" "release/${asset}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "gh-ai-credit-pulse (${short_sha})" \
              --notes "$notes" \
              --prerelease
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' |
          while IFS= read -r old_asset; do
            case "$old_asset" in
              "$asset"|"${asset}.sha256") ;;
              *) gh release delete-asset "$tag" "$old_asset" \
                   --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done

          # The rolling release supersedes the old per-build releases. The
          # SHA-named asset and provenance source digest retain commit identity.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName' |
          while IFS= read -r old_tag; do
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag --yes
          done

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/build-" \
            --jq '.[].ref' |
          while IFS= read -r old_ref; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/${old_ref#refs/}"
          done
