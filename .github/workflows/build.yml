name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Every action is pinned to an immutable, audited commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check scripts and metadata
        run: |
          jq empty extension/metadata.json
          bash -n install.sh gh-ai-credit-pulse

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-

      - name: Prepare native and Rust toolchains in parallel
        run: |
          (sudo apt-get update && sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev) &
          native_setup_pid=$!
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update &
          rust_setup_pid=$!
          wait "$native_setup_pid"
          wait "$rust_setup_pid"
          rustup default 1.96.0

      - name: Resolve Rust dependencies
        run: cargo generate-lockfile

      - name: Upload generated dependency lock
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Upload formatted Rust sources
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: formatted-rust-sources
          path: src
          if-no-files-found: error
          retention-days: 1

      - name: Test and build Rust binaries
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo build --release --locked

      - name: Assemble deterministic release bundle
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'probably-undefined/gh-ai-credit-pulse'
        run: |
          asset="gh-ai-credit-pulse-linux-x86_64-${GITHUB_SHA:0:12}.tar.gz"
          root=staging/gh-ai-credit-pulse
          install -d "$root/assets" "$root/extension" release
          install -m 0755 target/release/gh-ai-credit-pulse "$root/gh-ai-credit-pulse-gui"
          install -m 0755 target/release/gh-ai-credit-pulse-collector \
            "$root/gh-ai-credit-pulse-collector"
          install -m 0755 install.sh gh-ai-credit-pulse "$root/"
          install -m 0644 assets/io.github.probably_undefined.GhAiCreditPulse.desktop \
            assets/gh-ai-credit-pulse.png "$root/assets/"
          install -m 0644 extension/extension.js extension/metadata.json extension/stylesheet.css "$root/extension/"
          install -m 0644 VERSION README.md LICENSE "$root/"
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "release/${asset}" -C staging gh-ai-credit-pulse
          (cd release && sha256sum "$asset" >"${asset}.sha256")

      - name: Upload isolated build output
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'probably-undefined/gh-ai-credit-pulse'
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'probably-undefined/gh-ai-credit-pulse'
    needs: test-and-build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - name: Download verified workflow artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-bundle
          path: release

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz

      - name: Test consumer verification policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-ref "refs/heads/main" \
            --deny-self-hosted-runners

      - name: Publish immutable pre-release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="build-${short_sha}"
          asset="gh-ai-credit-pulse-linux-x86_64-${short_sha}.tar.gz"

          test -f "release/${asset}"
          test -f "release/${asset}.sha256"

          # The tag, filenames, checksum, and attestation all bind the release
          # to one immutable commit. GitHub-generated notes provide the changelog.
          gh release create "$tag" \
            "release/${asset}" "release/${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gh-ai-credit-pulse pre-release (${short_sha})" \
            --notes "Automated, provenance-attested build from the canonical main branch." \
            --generate-notes \
            --prerelease
