name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Every action is pinned to an immutable, audited commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test collector
        run: python3 -m unittest discover -s tests -v

      - name: Check scripts and metadata
        run: |
          python3 -m py_compile scripts/gh_ai_credits.py tests/test_collector.py
          python3 -m json.tool extension/metadata.json >/dev/null
          bash -n install.sh gh-ai-credit-pulse

      - name: Restore Rust build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-

      - name: Prepare native and Rust toolchains in parallel
        run: |
          (sudo apt-get update && sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev) &
          native_setup_pid=$!
          rustup toolchain install 1.96.0 --profile minimal --no-self-update &
          rust_setup_pid=$!
          wait "$native_setup_pid"
          wait "$rust_setup_pid"
          rustup default 1.96.0

      - name: Build locked release binary
        run: cargo build --release --locked

      - name: Assemble deterministic release bundle
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'probably-undefined/gh-ai-credit-pulse'
        run: |
          asset="gh-ai-credit-pulse-linux-x86_64-${GITHUB_SHA:0:12}.tar.gz"
          root=staging/gh-ai-credit-pulse
          install -d "$root/assets" "$root/extension" "$root/scripts" release
          install -m 0755 target/release/gh-ai-credit-pulse "$root/gh-ai-credit-pulse-gui"
          install -m 0755 install.sh gh-ai-credit-pulse "$root/"
          install -m 0755 scripts/gh_ai_credits.py "$root/scripts/"
          install -m 0644 assets/io.github.probably_undefined.GhAiCreditPulse.desktop \
            assets/gh-ai-credit-pulse.png "$root/assets/"
          install -m 0644 extension/extension.js extension/metadata.json extension/stylesheet.css "$root/extension/"
          install -m 0644 VERSION README.md LICENSE "$root/"
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "release/${asset}" -C staging gh-ai-credit-pulse
          (cd release && sha256sum "$asset" >"${asset}.sha256")

      - name: Upload isolated build output
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'probably-undefined/gh-ai-credit-pulse'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'probably-undefined/gh-ai-credit-pulse'
    needs: test-and-build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - name: Download verified workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz

      - name: Test consumer verification policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/gh-ai-credit-pulse-linux-x86_64-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-ref "refs/heads/main" \
            --deny-self-hosted-runners

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=latest

          # A GitHub release always requires a tag. Replace the single rolling
          # tag instead of leaving one permanent build tag behind per commit.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
          fi

          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest verified build (${GITHUB_SHA:0:12})" \
            --notes "Automated, provenance-attested build from the protected main branch." \
            --latest

          # One-time cleanup of tags/releases created by the old per-build scheme.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName | select(startswith("build-"))' |
          while IFS= read -r stale_tag; do
            gh release delete "$stale_tag" \
              --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/build-" \
            --jq '.[].ref' |
          while IFS= read -r stale_ref; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/${stale_ref#refs/}"
          done
