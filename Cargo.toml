[package]
name = "gh-ai-credit-pulse"
version = "1.2.0"
edition = "2024"
default-run = "gh-ai-credit-pulse"
license = "MIT"
description = "Modern GitHub Copilot AI credit dashboard built with Rust and Iced"
repository = "https://github.com/probably-undefined/gh-ai-credit-pulse"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
iced = { version = "0.14", features = ["tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
